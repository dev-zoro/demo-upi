<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI</title>
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/balance.css">
</head>
<body>
    <div id="container">
        <div id="navbar-container">
            <nav id="navbar">
                <a href="../index.html" class="navbar-options">Home</a>
                <a href="about.html" class="navbar-options">About</a>
                <a href="contact.html" class="navbar-options">Contact Us</a>
                <button id="login-btn" onclick="signUp()">Login/SignUp</button>
                <button id="user-btn"></button>
            </nav>
        </div>
        <div id="bank-details">
            <table id="bank-table">
                <thead>
                    <tr>
                        <th colspan="3">Bank Details</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="bank-name">
                        <td>Name</td>
                        <td>:</td>
                        <td></td>
                    </tr>
                    <tr id="acc-number">
                        <td>Account No.</td>
                        <td>:</td>
                        <td></td>
                    </tr>
                    <tr id="balance">
                        <td>Balance</td>
                        <td>:</td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
            <button id="check-bal">Check Balance</button>
        </div>
        <div id="check-box">
            <h3>Balance Check</h3>
            <div id="box-container">
                <form id="pay-form" onclick="return false">
                    <label for="">Name:</label>
                    <input type="text" id="name" disabled>

                    <label for="password">Password:</label>
                    <input type="password" id="password">
                    <small class="error"></small>

                    <div id="check-div">
                        <button id="check-btn">Check Balance</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../script/balance.js"></script>
</body>
</html>
