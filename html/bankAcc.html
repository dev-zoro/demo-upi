<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI</title>
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/mobileNum.css">
</head>
<body>
    <div id="container">
        <div id="navbar-container">
            <nav id="navbar">
                <a href="../index.html" class="navbar-options">Home</a>
                <a href="about.html" class="navbar-options">About</a>
                <a href="contact.html" class="navbar-options">Contact Us</a>
                <button id="login-btn" onclick="signUp()">Login/SignUp</button>
                <button id="user-btn"></button>
            </nav>
        </div>
        <div id="pay-box">
            <div id="box-container">
                <h2 id="title-name">Transfer Money</h2>
                <form id="pay-form" onclick="return false">
                    <label for="number">Account Number:</label>
                    <input type="number" id="number">
                    <small class="error"></small>

                    <label for="amount">Amount:</label>
                    <input type="number" id="amount">
                    <small class="error"></small>

                    <label for="account">Select Account:</label>
                    <select name="accounts" id="account-opt">
                        <option value="">Select Bank Account</option>
                    </select>

                    <button id="send-btn">Send Money</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../script/bankAcc.js"></script>
</body>
</html>
