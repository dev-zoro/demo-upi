<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/profileBase.css">
    <link rel="stylesheet" href="../style/profile.css">
</head>
<body>
    
    <div id="container">
        <div id="navbar-container">
            <nav id="navbar">
                <a href="../index.html" class="navbar-options">Home</a>
                <a href="about.html" class="navbar-options">About</a>
                <a href="contact.html" class="navbar-options">Contact Us</a>
                <button id="login-btn" onclick="signUp()">Login/SignUp</button>
                <button id="user-btn"></button>
            </nav>
        </div>
        <div id="user-profile">
            <div id="user-img-container">
                <div id="user-img-div">
                    <img src="https://cdn.pixabay.com/photo/2017/11/10/05/48/user-2935527_640.png" alt="user image">
                </div>
                <div id="option-div">
                    <button class="profile-btn">Information</button>
                    <button class="profile-btn">Bank Account</button>
                    <button class="profile-btn">Transcations</button>
                    <button class="profile-btn">Logout</button>
                </div>
            </div>
            <div id="user-info-container">
                <table id="user-table">
                    <thead>
                        <tr>
                            <th colspan="3">User Information</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="user-name">
                            <td>Name</td>
                            <td>:</td>
                            <td></td>
                        </tr>
                        <tr id="user-number">
                            <td>Number</td>
                            <td>:</td>
                            <td></td>
                        </tr>
                        <tr id="user-email">
                            <td>Email</td>
                            <td>:</td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>

                <form onclick="return false" id="user-edit-mode">
                    <label for="name">Name:</label>
                    <input type="text" id="edit-name">
                    <small class="error"></small>

                    <label for="name">Number:</label>
                    <input type="number" id="edit-number">
                    <small class="error"></small>

                    <label for="name">Email:</label>
                    <input type="email" id="edit-email">
                    <small class="error"></small>
                </form>

                <button id="edit-btn">
                    Edit
                </button>

                <button id="save-btn">
                    Save
                </button>
            </div>
        </div>
    </div>

    <script src="../script/profile.js"></script>
</body>
</html>
