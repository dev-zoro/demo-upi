<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/profileBase.css">
    <link rel="stylesheet" href="../style/bank.css">
</head>
<body>
     
    <div id="container">
        <div id="navbar-container">
            <nav id="navbar">
                <a href="../index.html" class="navbar-options">Home</a>
                <a href="about.html" class="navbar-options">About</a>
                <a href="contact.html" class="navbar-options">Contact Us</a>
                <button id="login-btn" onclick="signUp()">Login/SignUp</button>
                <button id="user-btn"></button>
            </nav>
        </div>
        <div id="user-profile">
            <div id="user-img-container">
                <div id="user-img-div">
                    <img src="https://cdn.pixabay.com/photo/2017/11/10/05/48/user-2935527_640.png" alt="user image">
                </div>
                <div id="option-div">
                    <button class="profile-btn">Information</button>
                    <button class="profile-btn">Bank Account</button>
                    <button class="profile-btn">Transcations</button>
                    <button class="profile-btn">Logout</button>
                </div>
            </div>
            <div id="user-info-container">
                <table id="bank-table">
                    <thead>
                        <tr>
                            <th colspan="3">Bank Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="bank-name">
                            <td>Name</td>
                            <td>:</td>
                            <td></td>
                        </tr>
                        <tr id="acc-number">
                            <td>Account No.</td>
                            <td>:</td>
                            <td></td>
                        </tr>
                        <tr id="ifsc-code">
                            <td>IFSC Code</td>
                            <td>:</td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>

                <!-- <h2>Bank Details</h2>
                <div id="bank-info">
                    <div id="bank-detail">
                        <span>Bank Name</span>
                        <span>:</span>
                        <span>Account Number</span>
                    </div>
                </div> -->

                <form onclick="return false" id="bank-edit-mode">
                    <label for="name">Bank Name:</label>
                    <input type="text" id="edit-bank-name">
                    <small class="error"></small>

                    <label for="name">Account Number:</label>
                    <input type="number" id="edit-acc-number">
                    <small class="error"></small>

                    <label for="name">IFSC Code:</label>
                    <input type="email" id="edit-ifsc-code">
                    <small class="error"></small>
                </form>

                <button id="add-btn">
                    Add Account
                </button>

                <button id="save-btn">
                    Save
                </button>
            </div>
        </div>
    </div>

    <script src="../script/bank.js"></script>
</body>
</html>
